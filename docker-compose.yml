version: "3.9"
services:
  db:
    image: postgres:16
    container_name: sicop_db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: proyectos
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
  adminer:
    image: adminer
    container_name: sicop_adminer
    ports:
      - "8080:8080"
    depends_on:
      - db
  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    container_name: sicop_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console
    volumes:
      - minio-data:/data
volumes:
  db-data:
  minio-data:

