version: "3.9"
services:
  db:
    image: postgres:16
    container_name: sicop_db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: proyectos
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
  adminer:
    image: adminer
    container_name: sicop_adminer
    ports:
      - "8080:8080"
    depends_on:
      - db
volumes:
  db-data:
